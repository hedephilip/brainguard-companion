<a class="skip" href="#view" data-i18n="skip">Skip to content</a>

<div class="shell">
  <aside class="side" aria-label="Primary">
    <div class="brand">
      <img src="assets/mark.png" alt="" width="38" height="38">
      <div>
        <b>BrainGuard</b>
        <span>Companion</span>
      </div>
    </div>

    <nav id="sidenav" class="nav"></nav>

    <div class="side-foot">
      <button class="btn-emergency" data-go="emergency">
        <svg class="ic"><use href="#i-alert"/></svg>
        <span data-i18n="nav_emergency">Emergency</span>
      </button>
      <div class="local-badge" title="All data stays on this device">
        <span class="dot"></span><span data-i18n="local_only">On this device only</span>
      </div>
      <label class="langpick">
        <svg class="ic"><use href="#i-globe"/></svg>
        <select id="langSel" aria-label="Language"></select>
      </label>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-l">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
          <svg class="ic"><use href="#i-plan"/></svg>
        </button>
        <div>
          <h1 id="pageTitle">Today</h1>
          <p id="pageSub" class="sub"></p>
        </div>
      </div>
      <div class="topbar-r">
        <span class="pill quiet" id="streakPill">0 day streak</span>
        <button class="icon-btn" data-go="emergency" aria-label="Emergency check">
          <svg class="ic danger"><use href="#i-alert"/></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <span>BrainGuard Companion · v3.6</span>
      <span class="sep"></span>
      <span data-i18n="foot_disclaimer">Wellness guidance only. Not a diagnosis and not a medical device.</span>
      <span class="hede">HEDE</span>
    </footer>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Primary mobile"></nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script src="assets/app.js"></script>

</html>
